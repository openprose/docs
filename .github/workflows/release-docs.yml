name: Release Docs
run-name: ${{ github.event_name == 'workflow_run' && 'Stage Docs candidate' || format('Docs {0} {1}', inputs.operation, inputs.environment) }}
on:
  workflow_run:
    workflows: [Build retained Docs images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [promote, rollback, register, verify]
        required: true
      environment:
        type: choice
        options: [staging, production]
        default: production
        required: true
      producer_run:
        description: Successful retained build run ID
        required: true
        type: string
      producer_attempt:
        description: Successful retained build attempt
        required: true
        type: string
      previous_run:
        description: Optional exact current verified release run/attempt
        type: string
      staging_run:
        description: Optional exact staging proof run/attempt
        type: string
      rollback_run:
        description: Verified retained target run/attempt (required for rollback)
        type: string
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' && vars.DOCS_AWS_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'openprose/docs') ||
       (github.event_name == 'workflow_dispatch' &&
        (vars.DOCS_AWS_ENABLED == 'true' || inputs.operation == 'register' || inputs.operation == 'verify')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docs-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    concurrency:
      group: docs-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DOCS_RELEASE_CONFIG: ${{ secrets.DOCS_RELEASE_CONFIG }}
      DOCS_ROLE_ID: ${{ secrets.DOCS_ROLE_ID }}
      DOCS_ROLE_ARN: ${{ secrets.DOCS_RELEASE_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
      DOCS_AWS_ENABLED: ${{ vars.DOCS_AWS_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mask operational configuration
        run: node scripts/release/runner.mjs mask
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DOCS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: docs-release
      - name: Revalidate and release retained artifact
        run: node scripts/release/runner.mjs release
