name: Release retained Docs image
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      operation:
        required: true
        type: string
      producer_run:
        required: true
        type: string
      producer_attempt:
        required: true
        type: string
      previous_run:
        default: ''
        type: string
      staging_run:
        default: ''
        type: string
      rollback_run:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docs-${{ inputs.environment }}
    concurrency:
      group: docs-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DOCS_RELEASE_CONFIG: ${{ secrets.DOCS_RELEASE_CONFIG }}
      DOCS_ROLE_ID: ${{ secrets.DOCS_ROLE_ID }}
      DOCS_ROLE_ARN: ${{ secrets.DOCS_RELEASE_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
      PREVIOUS_RUN: ${{ inputs.previous_run }}
      STAGING_RUN: ${{ inputs.staging_run }}
      ROLLBACK_RUN: ${{ inputs.rollback_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mask operational configuration
        run: node scripts/release/runner.mjs mask
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DOCS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: docs-release
      - name: Revalidate and release retained artifact
        run: node scripts/release/runner.mjs release
