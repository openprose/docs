name: Verify

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Informational, not a gate: advisories here are dominated by deep
      # transitive packages we do not control, and a permanently red step
      # teaches everyone to ignore it. Read the output.
      - run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm spell
      - run: pnpm check:emdash
      - run: pnpm check:links
      - run: pnpm test
      - run: pnpm test:release
      - name: Check analytics preflight in Docker context
        run: |
          docker build --file - . <<'DOCKERFILE'
          FROM node:22-alpine
          WORKDIR /app
          COPY . .
          RUN NEXT_PUBLIC_POSTHOG_ENVIRONMENT=production \
              NEXT_PUBLIC_POSTHOG_KEY=current-fixture \
              NEXT_PUBLIC_POSTHOG_LEGACY_PROJECT_TOKEN=legacy-fixture \
              sh scripts/check-analytics-build.sh
          DOCKERFILE
      # Build the standalone server in both modes and check each one over
      # HTTP. Public mode is what production ships, so it goes first. `pnpm
      # exec` skips the prebuild hook, matching the Dockerfile.
      - name: Build public mode
        run: pnpm exec next build
        env:
          DOCS_PREVIEW_MODE: "false"
      - name: Smoke public build over HTTP
        run: pnpm smoke:standalone --mode public
      - name: Build preview mode
        run: pnpm exec next build
        env:
          DOCS_PREVIEW_MODE: "true"
      - name: Smoke preview build over HTTP
        run: pnpm smoke:standalone --mode preview
