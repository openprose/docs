name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Informational, not a gate: advisories here are dominated by deep
      # transitive packages we do not control, and a permanently red step
      # teaches everyone to ignore it. Read the output.
      - run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm spell
      - run: pnpm check:emdash
      - run: pnpm check:links
      - run: pnpm test
      - run: pnpm exec next build
        env:
          DOCS_PREVIEW_MODE: "true"
