name: Bootstrap Docs service
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      operation:
        type: choice
        options: [register, verify]
        required: true
      producer_run:
        description: Successful retained build run ID
        required: true
        type: string
      producer_attempt:
        description: Successful retained build attempt
        required: true
        type: string
      staging_run:
        description: Optional exact staging proof run/attempt
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-docs.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.operation }}
      producer_run: ${{ inputs.producer_run }}
      producer_attempt: ${{ inputs.producer_attempt }}
      staging_run: ${{ inputs.staging_run }}
