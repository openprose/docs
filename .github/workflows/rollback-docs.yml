name: Rollback Docs retained image
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: production
        required: true
      producer_run:
        description: Successful retained build run ID
        required: true
        type: string
      producer_attempt:
        description: Successful retained build attempt
        required: true
        type: string
      staging_run:
        description: Optional exact staging proof run/attempt
        type: string
      rollback_run:
        description: Verified retained target release run/attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.DOCS_AWS_ENABLED == 'true'
    uses: ./.github/workflows/release-docs.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      operation: rollback
      producer_run: ${{ inputs.producer_run }}
      producer_attempt: ${{ inputs.producer_attempt }}
      staging_run: ${{ inputs.staging_run }}
      rollback_run: ${{ inputs.rollback_run }}
