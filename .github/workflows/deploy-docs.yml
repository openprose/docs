name: Recover Docs on Fly.io
on:
  workflow_dispatch:
    inputs:
      image:
        description: Retained Fly registry image with sha256 digest (no rebuild)
        required: true
        type: string
concurrency:
  group: docs-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: docs-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy retained image
        env:
          IMAGE: ${{ inputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! [[ "$IMAGE" =~ ^registry\.fly\.io/openprose-docs@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Expected an immutable retained Docs Fly image.' >&2
            exit 1
          fi
          flyctl deploy --image "$IMAGE"
      - name: Verify live robots.txt
        run: scripts/check-live-robots.sh https://docs.prose.md
