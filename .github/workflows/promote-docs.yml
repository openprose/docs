name: Promote Docs production
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Successful retained build run ID
        required: true
        type: string
      producer_attempt:
        description: Successful retained build attempt
        required: true
        type: string
      previous_run:
        description: Optional exact current verified release run/attempt
        type: string
      staging_run:
        description: Optional exact staging proof run/attempt
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.DOCS_AWS_ENABLED == 'true'
    uses: ./.github/workflows/release-docs.yml
    secrets: inherit
    with:
      environment: production
      operation: promote
      producer_run: ${{ inputs.producer_run }}
      producer_attempt: ${{ inputs.producer_attempt }}
      previous_run: ${{ inputs.previous_run }}
      staging_run: ${{ inputs.staging_run }}
